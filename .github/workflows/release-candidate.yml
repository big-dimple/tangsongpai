name: CI and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      SMOKE_BROWSERS: chromium
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Select system Chrome
        run: |
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          echo "SMOKE_CHROMIUM_EXECUTABLE_PATH=$chrome" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Test candidate validation
        run: python3 -B -m unittest discover -s tests -p 'test_*release*.py'
      - name: Run the complete gate and build once
        run: npm run verify:ci -- --scope=all
      - name: Install screenshot fonts and video support for temporary review
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-wqy-microhei ffmpeg
      - name: Exercise tutorial and Liu E on desktop and phone
        run: |
          revision="$(node -p "require('./node_modules/playwright-core/browsers.json').browsers.find(x=>x.name==='ffmpeg').revision")"
          mkdir -p "/tmp/tsp-playwright/ffmpeg-$revision"
          ln -sf "$(command -v ffmpeg)" "/tmp/tsp-playwright/ffmpeg-$revision/ffmpeg-linux"
          export PLAYWRIGHT_BROWSERS_PATH=/tmp/tsp-playwright
          NOVICE_LESSON_CASE=desktop,phone390 NOVICE_LESSON_OUT=shots/ci/novice node harness/novice-interactions-lesson.mjs
          NOVICE_LESSON_CASE=phone390 NOVICE_LESSON_PAYOFF_ONLY=1 NOVICE_LESSON_OUT=shots/ci/novice-payoff node harness/novice-interactions-lesson.mjs
          NOVICE_LESSON_CASE=phone390 NOVICE_LESSON_MOTION=system NOVICE_LESSON_OUT=shots/ci/novice-reduced node harness/novice-interactions-lesson.mjs
          LIUE_STAGE_OUT=shots/ci/liue-stage node harness/liue-listening-stage.mjs
          LIUE_PAYOFF_MODE=checks LIUE_PAYOFF_CASES=390-10-special LIUE_PAYOFF_OUT=shots/ci/liue-repeat node harness/liue-skill-payoff.mjs
      - name: Prepare and verify release candidate
        run: |
          python3 scripts/prepare-release-artifact.py
          python3 scripts/verify-release-artifact.py "shots/deploy/$GITHUB_SHA" "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            shots/deploy/${{ github.sha }}/dist.tar.gz
            shots/deploy/${{ github.sha }}/dist.tar.gz.sha256
            shots/deploy/${{ github.sha }}/manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/release-candidate
      - name: Verify downloaded candidate
        run: python3 scripts/verify-release-artifact.py "$RUNNER_TEMP/release-candidate" "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-candidate-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            shots/ci/
            shots/smoke-result.json
            shots/smoke-failure.png
            shots/smoke-failure-dom.html
          if-no-files-found: ignore
          retention-days: 14

  publish:
    # A manual run on any other branch can build a candidate but cannot publish.
    if: github.ref == 'refs/heads/main'
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/release-candidate
      - name: Publish verified candidate
        run: python3 -B scripts/publish-release.py "$RUNNER_TEMP/release-candidate" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
