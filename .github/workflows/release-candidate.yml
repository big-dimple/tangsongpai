name: Route seal isolated browser check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      ROUTE_CHOICE_OUT: shots/route
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install CJK fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-wqy-microhei
      - run: npm ci
      - name: Run route presentation and sound-bus checks
        run: |
          export SMOKE_CHROMIUM_EXECUTABLE_PATH="$(command -v google-chrome || command -v chromium)"
          test -n "$SMOKE_CHROMIUM_EXECUTABLE_PATH"
          node harness/route-choice.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seal-browser-evidence-${{ github.run_id }}
          path: shots/route/
          if-no-files-found: ignore
          retention-days: 3
