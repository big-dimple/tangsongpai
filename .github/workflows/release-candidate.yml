name: Release candidate

on:
  push:
    branches: [main]
  workflow_dispatch:

# This workflow only produces an Actions artifact; it does not publish a Release.
permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      SMOKE_BROWSERS: chromium
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Select system Chrome
        run: |
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          echo "SMOKE_CHROMIUM_EXECUTABLE_PATH=$chrome" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Test candidate validation
        run: python3 -B -m unittest discover -s tests -p 'test_release_candidate.py'
      - name: Run the complete gate and build once
        run: npm run verify:ci -- --scope=all
      - name: Prepare and verify release candidate
        run: |
          python3 scripts/prepare-release-artifact.py
          python3 scripts/verify-release-artifact.py "shots/deploy/$GITHUB_SHA" "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            shots/deploy/${{ github.sha }}/dist.tar.gz
            shots/deploy/${{ github.sha }}/dist.tar.gz.sha256
            shots/deploy/${{ github.sha }}/manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/release-candidate
      - name: Verify downloaded candidate
        run: python3 scripts/verify-release-artifact.py "$RUNNER_TEMP/release-candidate" "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-candidate-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            shots/ci/
            shots/smoke-result.json
            shots/smoke-failure.png
            shots/smoke-failure-dom.html
          if-no-files-found: ignore
          retention-days: 14
